services:
  mongo:
    image: mongo:7
    container_name: chess64-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo64:/data/db

  redis:
    image: redis:7-alpine
    container_name: chess64-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  server-main:
    build:
      context: ./server
    container_name: chess64-server-main
    restart: unless-stopped
    environment:
      PORT: "8080"
      FRONTEND_URL: "http://${PUBLIC_IP}:5173"
      MONGODB_URL: "${MONGODB_URL}"
      REDIS_URL: "${REDIS_URL}"
      JWT_TOKEN_SECRET: "${JWT_TOKEN_SECRET}"
      JWT_TOKEN_SIGNUP_MAIL_SECRET: "${JWT_TOKEN_SIGNUP_MAIL_SECRET}"
      JWT_RESET_PASSWORD_SECRET: "${JWT_RESET_PASSWORD_SECRET}"
      NODEMAILER_MAIL: "${NODEMAILER_MAIL}"
      NODEMAIL_APP_PASSWORD: "${NODEMAIL_APP_PASSWORD}"
      STOCKFISH_EMAIL: "${STOCKFISH_EMAIL}"
      STOCKFISH_PASSWORD: "${STOCKFISH_PASSWORD}"
    command: npm run start:main
    depends_on:
      - mongo
      - redis
    ports:
      - "8080:8080"

  server-ws:
    build:
      context: ./server
    container_name: chess64-server-ws
    restart: unless-stopped
    environment:
      PORT: "9090"
      FRONTEND_URL: "http://${PUBLIC_IP}:5173"
      MONGODB_URL: "${MONGODB_URL}"
      REDIS_URL: "${REDIS_URL}"
      JWT_TOKEN_SECRET: "${JWT_TOKEN_SECRET}"
    command: npm run start:ws
    depends_on:
      - mongo
      - redis
    ports:
      - "9090:9090"

  server-stockfish:
    build:
      context: ./server
    container_name: chess64-server-stockfish
    restart: unless-stopped
    environment:
      PORT: "8081"
      FRONTEND_URL: "http://${PUBLIC_IP}:5173"
      MONGODB_URL: "${MONGODB_URL}"
      REDIS_URL: "${REDIS_URL}"
      JWT_TOKEN_SECRET: "${JWT_TOKEN_SECRET}"
      STOCKFISH_EMAIL: "${STOCKFISH_EMAIL}"
      STOCKFISH_PASSWORD: "${STOCKFISH_PASSWORD}"
    command: npm run start:stockfish
    depends_on:
      - mongo
      - redis
    ports:
      - "8081:8081"

  server-dbupdates:
    build:
      context: ./server
    container_name: chess64-server-dbupdates
    restart: unless-stopped
    environment:
      FRONTEND_URL: "http://${PUBLIC_IP}:5173"
      MONGODB_URL: "${MONGODB_URL}"
      REDIS_URL: "${REDIS_URL}"
    command: npm run start:microservice:dbupdates
    depends_on:
      - mongo
      - redis
    ports:
      - "9191:9191"

  client:
    build:
      context: ./client
    container_name: chess64-client
    restart: unless-stopped
    environment:
      VITE_API_URL: "http://${PUBLIC_IP}:8080"
      VITE_GAME_SERVER_API_URL: "http://${PUBLIC_IP}:9090"
      VITE_STOCKFISH_SERVER_API_URL: "http://${PUBLIC_IP}:8081"
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - server-main
      - server-ws
      - server-stockfish
      - server-dbupdates
    ports:
      - "5173:5173"

volumes:
  mongo64:
